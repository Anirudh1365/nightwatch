<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NightWatch Login</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <div style="margin: 32px 0 20px">
    <div class="brand" style="font-size:1.6rem">Night<span>Watch</span></div>
    <p class="muted">Hostel night attendance</p>
  </div>

  <form class="card" id="login-form">
    <div id="error" class="msg error hidden"></div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required placeholder="you@demo.edu">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>

    <button class="btn" id="submit">Login</button>
  </form>
</main>

<script src="api.js"></script>
<script>
  // Already logged in? Go straight to your page.
  const existing = NW.session();
  if (existing) location.href = NW.homeFor(existing.role);

  // One login for everyone: the server works out who you are and we send you to your page.
  const submit = document.getElementById("submit");
  const error = document.getElementById("error");

  document.getElementById("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    NW.show(error, "");
    submit.disabled = true;
    try {
      const data = await NW.api("/api/login", {
        method: "POST",
        body: {
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
        },
      });
      NW.save(data);   // {token, name, role, block_id}
      location.href = NW.homeFor(data.role);
    } catch (err) {
      NW.show(error, err.message);
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
